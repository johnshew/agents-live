[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents-live"
version = "5.0.1"
description = "Take your agents live: cron and file-watch dispatch, safety wrappers, and operations for standard agent definitions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["PyYAML", "mcp[cli]", "jsonschema"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
agents-live = "agents_live.cli:main"

[project.urls]
Homepage = "https://github.com/johnshew/agents-live"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_live"]
