[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents-live"
version = "6.3.4"
description = "Take your agents live: cron and file-watch dispatch, safety wrappers, and operations for standard agent definitions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# mcp is held below 2.0: that release removed mcp.server.fastmcp, which
# the pipeline server is written against (#205). Lift the bound with the
# port to the 2.x server API, not before.
dependencies = ["PyYAML", "mcp[cli]<2", "jsonschema"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
agents-live = "agents_live.cli:main"

[project.urls]
Homepage = "https://github.com/johnshew/agents-live"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_live"]
include = [
    "src/agents_live/skill/**",
    "src/agents_live/windows-heartbeat.sh",
]
