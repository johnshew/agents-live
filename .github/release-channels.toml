[bake.recommendations]
overall = "Release 6.9.2 through numbered release candidates. Reserve rc1 for the legacy rejected attempt without changing its original 6.9.2 artifact identity or claiming unavailable evidence. Implement and validate #511 before preparing rc2, finish #510 and #509, and correct #508's display defect with an explicit decision on its remaining editing scope. Preserve published 6.9.1 and require independent acceptance of the final stable bytes. Do not prepare or publish with the old stable-numbered candidate workflow."
"508" = "Fix configured model and effort display separately from last-run telemetry. Obtain explicit developer approval before deferring provider-aware editing and context controls; that deferral has not been approved."
"509" = "Fix compact Windows scheduling and prove actual same-day scheduled firing, calendar phase, stable convergence, and no duplicate midnight runs. Registration and doctor output alone are not acceptance."
"511" = "Implement numbered RC preparation, side-by-side staging and selection, rejection and rollback, exact-artifact acceptance, final stable retry identities, and stable-only publication guards. Keep candidate preparation and promotion blocked until this workflow is implemented and validated."
"105" = "Defer span correlation and sensitivity metadata to a dedicated schema release; current run IDs and bounded log and timeline queries remain the operational workaround."
"388" = "Defer the remaining registration and initialization clean break to the planned major-version boundary; the additive 6.x groundwork is already delivered."
"434" = "Defer removal of the 5.x compatibility surface to 7.0 as explicitly scoped by the issue."
"478" = "Keep numeric usage queries and summaries in 6.10. Existing timing, usage retention, and successful processor early-finish corrections belong in this patch; no separate model-bypass signal is planned."
"486" = "The developer approved proceeding with the patch release after both exact-version managed-proxy checks remained unavailable on 2026-09-11. Keep consumer-resolution verification open and use the verified official GitHub release bootstrap. Do not change package sources, weaken TLS, or republish immutable versions."
"489" = "Keep the internal generation-to-version terminology cleanup separate; the public version commands remain available and this refactor is not required for the patch fixes."
testing = "The last recorded bake deployment is historical evidence, not acceptance of an RC or this machine's installed version. After the RC workflow and fixes pass required Windows/Linux checks, prepare 6.9.2rc2 and validate side-by-side installation, deliberate selection, rollback, replacement, watcher restoration, dashboard operations and clean shutdown, and real provider cost evidence. Confirm life repository ownership before exercising automation. Rejected RCs advance to rc3 without changing the stable target. Build and independently accept final 6.9.2 only after RC acceptance and exact-commit approval. Verify GitHub and public PyPI publication separately from managed-proxy propagation."
