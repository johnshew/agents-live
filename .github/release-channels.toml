[bake.recommendations]
overall = "Historical bake observations below predate the active release-cycles.toml decision. Complete functional checks during RC evaluation and record developer acceptance of the exact RC. Then package, finalize, and publish without additional functional testing. Use the configured cycle branch and exact approval; local deployment observations do not identify a universal current installation."
"508" = "Configured model and effort display is fixed in #514 with reload coverage in #524. Remaining provider-aware editing and context controls are split to #525, proposed for 6.10. Obtain explicit developer approval before deferring that scope from this stable release; the deferral has not been approved."
"509" = "Fixed in #514. A real temporary Windows hourly task fired one second after its expected same-day boundary, without immediate catch-up or definition change. Boundary and phase regression suites pass; cleanup succeeded."
"511" = "Numbered RC tooling retains evidence, rejection, deferred stable tagging, and stable-only publication. Functional checks and in-situ evaluation belong to the RC process. Exact developer RC acceptance authorizes final packaging and publication without further functional testing or a stable acceptance receipt."
"516" = "RC4 passed the unchanged Windows focus-readiness gate according to its preparing environment. RC3 remains a rejected historical attempt with no established root cause. Keep the gate and require explicit disposition before promotion; do not relabel RC3 as passing."
"517" = "Windows bootstrap fixes merged in #520 and passed Windows/Linux CI. Delivered to RC, not yet released; close through promotion after required acceptance."
"518" = "Locally eligible started-provider health checks merged in #520. Delivered to RC, not yet released. The old installed-runtime recovery requirement remains tracked separately in #522."
"519" = "Windows real-child processor-control and public-log tests pass in the RC source, but the reported 6.9.1 failure is not independently reproduced. Capture the affected parent/child paths and active-directory lifetime in a temporary reproduction; do not add handler-specific mkdir or claim a fix from existing tests."
"522" = "Recovery tooling merged in #523. Retained preparation identity and successful exact-wheel readiness are mandatory; do not rebuild RC4 or use a new artifact as its recovery receipt. Live recovery remains unverified where those inputs are unavailable."
"105" = "Defer span correlation and sensitivity metadata to a dedicated schema release; current run IDs and bounded log and timeline queries remain the operational workaround."
"388" = "Defer the remaining registration and initialization clean break to the planned major-version boundary; the additive 6.x groundwork is already delivered."
"434" = "Defer removal of the 5.x compatibility surface to 7.0 as explicitly scoped by the issue."
"478" = "Keep numeric usage queries and summaries in 6.10. Existing timing, usage retention, and successful processor early-finish corrections belong in this patch; no separate model-bypass signal is planned."
"486" = "The developer approved proceeding with the patch release after both exact-version managed-proxy checks remained unavailable on 2026-09-11. Keep consumer-resolution verification open and use the verified official GitHub release bootstrap. Do not change package sources, weaken TLS, or republish immutable versions."
"489" = "Keep the internal generation-to-version terminology cleanup separate; the public version commands remain available and this refactor is not required for the patch fixes."
testing = "RC2, RC3, and RC4 observations are historical and are not interchangeable artifact or installation receipts. All functional checks belong to RC evaluation. Record exact developer RC acceptance in release-cycles.toml; stable packaging and publication perform identity and provenance checks only, without functional retesting."
