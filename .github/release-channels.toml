overall = "Integrate and validate the completed fixes for 6.9.1. The developer requested a patch release; planned accounting and deterministic model-bypass features remain in 6.10. Preserve the published 6.9.0 release and require exact-candidate acceptance before publishing 6.9.1."
"105" = "Defer span correlation and sensitivity metadata to a dedicated schema release; current run IDs and bounded log and timeline queries remain the operational workaround."
"388" = "Defer the remaining registration and initialization clean break to the planned major-version boundary; the additive 6.x groundwork is already delivered."
"434" = "Defer removal of the 5.x compatibility surface to 7.0 as explicitly scoped by the issue."
"478" = "Keep accounting, usage summaries, and deterministic model bypass in the planned 6.10 feature release; they are not prerequisites for the requested 6.9.1 fixes."
"489" = "Keep the internal generation-to-version terminology cleanup separate; the public version commands remain available and this refactor is not required for the patch fixes."
testing = "The exact recorded 6.9.1 bake passed source gates, packaged dashboard readiness, and supported local deployment postchecks. After promotion, prepare and accept a fresh official candidate, including installed replacement, watcher restoration, dashboard operations, and provider cost evidence. Bake evidence is not official-candidate acceptance. Verify public PyPI artifacts separately from managed-proxy propagation."
