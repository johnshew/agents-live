"388" = "Defer the remaining registration and initialization clean break to the planned major-version boundary; the additive 6.x groundwork is already delivered."
"434" = "Defer removal of the 5.x compatibility surface to 7.0 as explicitly scoped by the issue."
testing = "The deployment fields retain the last successfully tested 6.9 baseline; no 6.10 artifact has been built, installed, or accepted. Validate 6.10 changes in source and isolated artifacts without replacing the runtime used for 6.9 acceptance. The 6.9 branch retains its own promotion decisions and release evidence."