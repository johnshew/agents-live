name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.2)"
        required: true

permissions: {}

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Require canonical stable tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Verify stable release identity
        run: uv run --script tools/release.py --verify-publication "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      - id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: pyproject.toml
      - run: >-
          gh release download "$TAG"
          --pattern '*.whl'
          --pattern '*.tar.gz'
          --pattern 'install.ps1'
          --pattern 'install.sh'
          --pattern 'SHA256SUMS-*'
          --pattern 'release-evidence.json'
          --dir dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      - run: cd dist && sha256sum --check SHA256SUMS-*
      - run: uv run --script tools/release.py --verify-publication-assets "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      - run: >-
          uv publish dist/*.whl dist/*.tar.gz
          --check-url https://pypi.org/simple/
          --trusted-publishing always
