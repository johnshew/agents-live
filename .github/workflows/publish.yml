name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.2)"
        required: true

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      artifact-name: verified-release-dist
    permissions:
      contents: read

  publish:
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: astral-sh/setup-uv@v5
      # Publish the artifacts built by the exact-SHA Ubuntu verification job;
      # do not rerun the same gates and rebuild them in this job.
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-dist
          path: dist
      - run: gh release download "$TAG" --pattern 'SHA256SUMS-*' --dir dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      - run: cd dist && sha256sum --check SHA256SUMS-*
      # Attach the exact artifacts going to PyPI before publishing, so a
      # failed upload can be rerun without hitting PyPI's duplicate check.
      - run: gh release upload "$TAG" dist/*.whl dist/*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      - run: >-
          uv publish dist/*.whl dist/*.tar.gz
          --check-url https://pypi.org/simple/
          --trusted-publishing always
