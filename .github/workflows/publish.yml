name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.2)"
        required: true

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
    permissions:
      contents: read

  publish:
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: pyproject.toml
      # Source verification above runs against the exact release commit. The
      # release assets are the exact wheel accepted through installed-tool,
      # watcher, browser, and provider-cost validation before publication.
      # Independent Windows/Linux builds are not byte-identical: line endings,
      # executable modes, and build-backend metadata vary by host.
      - run: >-
          gh release download "$TAG"
          --pattern '*.whl'
          --pattern '*.tar.gz'
          --pattern 'install.ps1'
          --pattern 'install.sh'
          --pattern 'SHA256SUMS-*'
          --dir dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      - run: cd dist && sha256sum --check SHA256SUMS-*
      - run: >-
          uv publish dist/*.whl dist/*.tar.gz
          --check-url https://pypi.org/simple/
          --trusted-publishing always
