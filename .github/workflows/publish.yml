name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.2)"
        required: true

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
    permissions:
      contents: read

  publish:
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: astral-sh/setup-uv@v5
      # The gates are declared once, in release.py, and run from there so
      # a manually dispatched tag cannot publish an unaudited artifact and
      # this file cannot drift from what a local release runs (#218). The
      # audit, the suite, and the build all run; the framework smoketest
      # is skipped because it needs a live agent CLI.
      - run: uv run --script tools/release.py --gates
      # Attach the exact artifacts going to PyPI before publishing, so a
      # failed upload can be rerun without hitting PyPI's duplicate check.
      - run: gh release upload "$TAG" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      - run: uv publish --trusted-publishing always
