name: Test

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      os:
        description: "Host to test"
        required: true
        default: all
        type: choice
        options:
          - all
          - ubuntu-latest
          - windows-latest
  workflow_call:
    inputs:
      ref:
        description: "Git ref or commit to test"
        required: false
        type: string
      os:
        description: "Host to test"
        required: false
        default: all
        type: string
      artifact-name:
        description: "Optional name for verified Ubuntu release artifacts"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            base="$MERGE_BASE"
            head="$MERGE_HEAD"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          full=false
          while IFS= read -r path; do
            case "$path" in
              src/agents_live/skill/SKILL.md|src/agents_live/skill/templates/*)
                full=true; break ;;
              *.md|docs/*|src/agents_live/skill/docs/*) ;;
              *) full=true; break ;;
            esac
          done < <(git diff --name-only "$base...$head")
          echo "full=$full" >> "$GITHUB_OUTPUT"

  audit:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: pyproject.toml
      - run: uv run --script tools/pre-release-audit.py

  source:
    if: needs.changes.outputs.full == 'true'
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'ubuntu-latest' && '["ubuntu-latest"]' || inputs.os == 'windows-latest' && '["windows-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
        suite:
          - tests/test_smoke.py
          - tests/test_seams.py
          - tests/test_behaviors.py
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: pyproject.toml
      - run: uv run --with-editable . --script ${{ matrix.suite }}

  wheel:
    if: needs.changes.outputs.full == 'true'
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.wheel.outputs.name }}
      sha256: ${{ steps.wheel.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: pyproject.toml
      - run: uv run --script tools/release.py --build-artifacts
      - id: wheel
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          echo "name=$(basename "$wheel")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$wheel" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: exact-wheel-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
      - if: inputs['artifact-name'] != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs['artifact-name'] }}
          path: dist/*
          if-no-files-found: error

  readiness:
    if: needs.changes.outputs.full == 'true'
    needs: [changes, wheel]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'ubuntu-latest' && '["ubuntu-latest"]' || inputs.os == 'windows-latest' && '["windows-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: pyproject.toml
      - uses: actions/download-artifact@v4
        with:
          name: exact-wheel-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - shell: bash
        env:
          WHEEL_NAME: ${{ needs.wheel.outputs.name }}
          WHEEL_SHA256: ${{ needs.wheel.outputs.sha256 }}
        run: echo "$WHEEL_SHA256  dist/$WHEEL_NAME" | sha256sum --check -
      - run: >-
          uv run --script tools/dashboard-readiness.py
          --wheel dist/${{ needs.wheel.outputs.name }}

  bootstrap-readiness:
    if: needs.changes.outputs.full == 'true'
    needs: [changes, wheel]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'ubuntu-latest' && '["ubuntu-latest"]' || inputs.os == 'windows-latest' && '["windows-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: pyproject.toml
      - uses: actions/download-artifact@v4
        with:
          name: exact-wheel-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - shell: bash
        env:
          WHEEL_NAME: ${{ needs.wheel.outputs.name }}
          WHEEL_SHA256: ${{ needs.wheel.outputs.sha256 }}
        run: echo "$WHEEL_SHA256  dist/$WHEEL_NAME" | sha256sum --check -
      - run: >-
          uv run --script tools/bootstrap-readiness.py
          --wheel dist/${{ needs.wheel.outputs.name }}

  test:
    if: always()
    needs: [changes, audit, source, wheel, readiness, bootstrap-readiness]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'ubuntu-latest' && '["ubuntu-latest"]' || inputs.os == 'windows-latest' && '["windows-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every selected gate
        shell: bash
        env:
          FULL: ${{ needs.changes.outputs.full }}
          CHANGES: ${{ needs.changes.result }}
          AUDIT: ${{ needs.audit.result }}
          SOURCE: ${{ needs.source.result }}
          WHEEL: ${{ needs.wheel.result }}
          READINESS: ${{ needs.readiness.result }}
          BOOTSTRAP_READINESS: ${{ needs.bootstrap-readiness.result }}
        run: |
          test "$CHANGES" = success
          test "$AUDIT" = success
          if test "$FULL" = true; then
            test "$SOURCE" = success
            test "$WHEEL" = success
            test "$READINESS" = success
            test "$BOOTSTRAP_READINESS" = success
          else
            echo "Documentation-only change; audit passed on Linux."
          fi
