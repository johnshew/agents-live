name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      # Both hosts report: a Windows-only break is the whole point of
      # running it, so it must not be hidden by cancelling the matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The audit reads the tree, not the host, so one run is the whole
      # check - and this is the host a release is cut on.
      - if: runner.os == 'Linux'
        run: uv run --script tools/pre-release-audit.py
      # duckdb is the query tool's own dependency, provisioned by its
      # PEP 723 header at runtime; the suite needs it to assert what
      # `agents-live logs` prints.
      - run: uv run --with-editable . --with duckdb python -m unittest tests.test_smoke
